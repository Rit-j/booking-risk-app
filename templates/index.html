<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Booking Risk Predictor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="background">
    <div class="overlay">
        <div class="card">
            <h1>Hotel Booking Risk</h1>
            <p class="subtitle">AI-powered cancellation forecasting</p>
            
            <form method="POST" action="/predict">
                <div class="form-group">
                    <label>Lead Time (days)</label>
                    <input type="number" name="lead_time" placeholder="e.g. 45" required>
                </div>

                <div class="form-group">
                    <label>Average Daily Rate (ADR)</label>
                    <input type="number" step="0.01" name="adr" placeholder="e.g. 120.00" required>
                </div>

                <div class="form-group">
                    <label>Total Nights</label>
                    <input type="number" name="total_nights" placeholder="e.g. 3" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Repeat Guest</label>
                        <select name="is_repeat">
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Special Requests</label>
                        <input type="number" name="special_requests" min="0" value="0" required>
                    </div>
                </div>

                <button type="submit">Analyze Risk</button>
            </form>

            {% if prediction %}
            <div class="result {% if 'Low' in prediction %}safe{% else %}risk{% endif %}">
                <h3>{{ prediction }}</h3>
                <p>Cancellation Probability: <strong>{{ probability }}%</strong></p>
            </div>
            {% endif %}
        </div>
    </div>
</div>

</body>
</html>
