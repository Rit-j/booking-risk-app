<!DOCTYPE html>
<html>
<head>
    <title>Hotel Booking Risk Predictor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h2>Hotel Booking Risk Predictor</h2>

<form method="POST" action="/predict">

    <label>Lead Time (days):</label>
    <input type="number" name="lead_time" required><br>

    <label>ADR (Average Daily Rate):</label>
    <input type="number" step="0.01" name="adr" required><br>

    <label>Total Nights:</label>
    <input type="number" name="total_nights" required><br>

    <label>Repeat Guest (1 = Yes, 0 = No):</label>
    <input type="number" name="is_repeat" min="0" max="1" required><br>

    <label>Special Requests:</label>
    <input type="number" name="special_requests" min="0" required><br>

    <button type="submit">Check Booking Risk</button>
</form>

{% if prediction %}
<hr>
<h3>Prediction: {{ prediction }}</h3>
<p>Cancellation Probability: {{ probability }}%</p>
{% endif %}

</body>
</html>
